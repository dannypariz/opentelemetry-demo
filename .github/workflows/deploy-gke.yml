name: Build and Deploy to GKE

on:
  push:
    branches: [main]
    paths-ignore:
      - 'deploy/image-manifest.json'
      - 'k8s/**'
      - 'demo/**'
      - 'deploy.sh'
      - 'demo-check.sh'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all services (not just changed)'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  IMAGE_REPO: dannypariz/opentelemetry-demo
  CLUSTER_NAME: dannyp-otel-demo
  CLUSTER_ZONE: us-central1-a
  GCP_PROJECT: solutions-engineering-248511
  NAMESPACE: otel-demo
  GRAFANA_URL: https://oteldemodanny.grafana.net

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # ── 1. Detect which services changed ──────────────────────────────────
      - name: Detect changed services
        id: changes
        env:
          FORCE: ${{ inputs.force_rebuild }}
        run: |
          python3 - <<'EOF'
          import os, json, subprocess

          SERVICE_MAP = {
              "src/accounting":      "accounting",
              "src/ad":              "ad",
              "src/cart/src":        "cart",
              "src/checkout":        "checkout",
              "src/currency":        "currency",
              "src/email":           "email",
              "src/fraud-detection": "fraud-detection",
              "src/frontend":        "frontend",
              "src/frontend-proxy":  "frontend-proxy",
              "src/image-provider":  "image-provider",
              "src/kafka":           "kafka",
              "src/llm":             "llm",
              "src/load-generator":  "load-generator",
              "src/payment":         "payment",
              "src/product-catalog": "product-catalog",
              "src/product-reviews": "product-reviews",
              "src/quote":           "quote",
              "src/recommendation":  "recommendation",
              "src/shipping":        "shipping",
          }

          force = os.environ.get("FORCE", "false").lower() == "true"

          result = subprocess.run(
              ["git", "diff", "--name-only", "HEAD~1", "HEAD"],
              capture_output=True, text=True
          )
          if result.returncode != 0 or not result.stdout.strip():
              result = subprocess.run(
                  ["git", "show", "--name-only", "--format=", "HEAD"],
                  capture_output=True, text=True
              )
          changed = result.stdout.strip()
          print(f"Changed files:\n{changed or '(none)'}")

          services = []
          for src_dir, component in SERVICE_MAP.items():
              if force or any(line.startswith(src_dir + "/") for line in changed.splitlines()):
                  services.append({"dir": src_dir, "component": component})

          output = json.dumps(services)
          print(f"Services to build: {output}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"services={output}\n")
              f.write(f"has_changes={'true' if services else 'false'}\n")
          EOF

      # ── 2. Authenticate to GHCR ────────────────────────────────────────────
      - name: Log in to GHCR
        if: steps.changes.outputs.has_changes == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.changes.outputs.has_changes == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Load build args from .env
        if: steps.changes.outputs.has_changes == 'true'
        run: grep -E '^OTEL_JAVA_AGENT_VERSION=|^OPENTELEMETRY_CPP_VERSION=' .env >> $GITHUB_ENV 2>/dev/null || true

      # ── 3. Build and push changed services ────────────────────────────────
      - name: Build and push changed service images
        if: steps.changes.outputs.has_changes == 'true'
        env:
          SERVICES: ${{ steps.changes.outputs.services }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'EOF'
          import json, os, subprocess

          services = json.loads(os.environ["SERVICES"])
          sha = os.environ["SHA"]
          repo = os.environ["IMAGE_REPO"]
          java_ver = os.environ.get("OTEL_JAVA_AGENT_VERSION", "")
          cpp_ver = os.environ.get("OPENTELEMETRY_CPP_VERSION", "")

          for svc in services:
              image = f"ghcr.io/{repo}:{svc['component']}-{sha}"
              print(f"\n▶ Building {image}")
              cmd = [
                  "docker", "buildx", "build",
                  "--file", f"{svc['dir']}/Dockerfile",
                  "--tag", image,
                  "--push",
                  "--platform", "linux/amd64",
                  "--cache-from", f"type=gha,scope={svc['component']}",
                  "--cache-to", f"type=gha,scope={svc['component']},mode=max",
                  ".",
              ]
              if java_ver:
                  cmd += ["--build-arg", f"OTEL_JAVA_AGENT_VERSION={java_ver}"]
              if cpp_ver:
                  cmd += ["--build-arg", f"OPENTELEMETRY_CPP_VERSION={cpp_ver}"]
              subprocess.run(cmd, check=True)
          EOF

      # ── 4. Update image manifest ───────────────────────────────────────────
      - name: Update image manifest
        if: steps.changes.outputs.has_changes == 'true'
        env:
          SERVICES: ${{ steps.changes.outputs.services }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'EOF'
          import json, os

          manifest_path = "deploy/image-manifest.json"
          services = json.loads(os.environ["SERVICES"])
          sha = os.environ["SHA"]
          repo = os.environ["IMAGE_REPO"]

          try:
              with open(manifest_path) as f:
                  manifest = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              manifest = {}

          for svc in services:
              manifest[svc["component"]] = {
                  "repository": f"ghcr.io/{repo}",
                  "tag": f"{svc['component']}-{sha}"
              }

          with open(manifest_path, "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")

          print("Updated manifest:")
          print(json.dumps(manifest, indent=2))
          EOF

      # ── 5. Authenticate to GCP ─────────────────────────────────────────────
      - name: Authenticate to GCP
        if: steps.changes.outputs.has_changes == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Get GKE credentials
        if: steps.changes.outputs.has_changes == 'true'
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.CLUSTER_ZONE }}
          project_id: ${{ env.GCP_PROJECT }}

      # ── 6. Deploy: kubectl set image for each changed service ──────────────
      - name: Deploy changed services
        if: steps.changes.outputs.has_changes == 'true'
        env:
          SERVICES: ${{ steps.changes.outputs.services }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'EOF'
          import json, os, subprocess

          services = json.loads(os.environ["SERVICES"])
          sha = os.environ["SHA"]
          repo = os.environ["IMAGE_REPO"]
          namespace = "otel-demo"

          for svc in services:
              image = f"ghcr.io/{repo}:{svc['component']}-{sha}"
              component = svc["component"]
              print(f"Deploying {component} -> {image}")
              result = subprocess.run(
                  ["kubectl", "set", "image",
                   f"deployment/{component}",
                   f"{component}={image}",
                   "-n", namespace],
                  capture_output=True, text=True
              )
              if result.returncode != 0:
                  print(f"Warning: kubectl set image failed for {component}: {result.stderr}")
              else:
                  print(f"OK: {result.stdout.strip() or component + ' image updated'}")
          EOF

      # ── 7. Post Grafana annotation ─────────────────────────────────────────
      - name: Annotate Grafana
        if: always()
        env:
          SERVICES: ${{ steps.changes.outputs.services }}
          SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          COMPONENTS=$(python3 -c "import json,os; svcs=json.loads(os.environ.get('SERVICES','[]')); print(', '.join(s['component'] for s in svcs) if svcs else 'config/workflow update')" 2>/dev/null || echo "unknown")
          SHORT_SHA=$(echo "$SHA" | cut -c1-7)
          TEXT="Deploy ${JOB_STATUS}: ${COMPONENTS} — <a href='https://github.com/${{ github.repository }}/commit/${SHA}'>${SHORT_SHA}</a>"
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.GRAFANA_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"${TEXT}\", \"tags\": [\"deploy\", \"otel-demo\"]}" \
            "${{ env.GRAFANA_URL }}/api/annotations" || echo "Grafana annotation skipped (non-fatal)"

      # ── 8. Commit updated image manifest ──────────────────────────────────
      - name: Commit image manifest
        if: steps.changes.outputs.has_changes == 'true' && success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update image manifest for ${{ github.sha }} [skip ci]"
          file_pattern: deploy/image-manifest.json
